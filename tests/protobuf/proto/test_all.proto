// Exercises every feature supported by odin-protoc.
syntax = "proto3";

package test.all;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "legacy.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_NEGATIVE = -1;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
}

message Optionals {
  optional int32 o_int32 = 1;
  optional string o_string = 2;
  optional bytes o_bytes = 3;
  optional Color o_enum = 4;
  optional double o_double = 5;
  optional bool o_bool = 6;
}

message Repeated {
  repeated int32 r_int32 = 1;
  repeated sint64 r_sint64 = 2;
  repeated fixed32 r_fixed32 = 3;
  repeated double r_double = 4;
  repeated bool r_bool = 5;
  repeated Color r_enum = 6;
  repeated string r_string = 7;
  repeated bytes r_bytes = 8;
  repeated Scalars r_message = 9;
  repeated int32 r_unpacked = 10 [packed = false];
  repeated float r_float = 11;
  repeated uint64 r_uint64 = 12;
  repeated sfixed64 r_sfixed64 = 13;
}

message Maps {
  map<string, string> m_string_string = 1;
  map<int32, int64> m_int32_int64 = 2;
  map<bool, Color> m_bool_enum = 3;
  map<string, Scalars> m_string_message = 4;
  map<uint64, bytes> m_uint64_bytes = 5;
  map<sint32, double> m_sint32_double = 6;
  map<fixed64, string> m_fixed64_string = 7;
}

message Nested {
  message Inner {
    int32 value = 1;
    message Deepest {
      string name = 1;
    }
    Deepest deepest = 2;
  }
  enum Mode {
    MODE_UNKNOWN = 0;
    MODE_FAST = 1;
  }
  Inner inner = 1;
  Mode mode = 2;
  repeated Inner inners = 3;
}

message Choice {
  oneof kind {
    string text = 1;
    int32 number = 2;
    Scalars scalars = 3;
    Color color = 4;
    bytes blob = 5;
    // Collides with nested type name Choice_Kind_Inner unless disambiguated.
    Inner inner = 6;
  }
  message Inner { int32 x = 1; }
  oneof other {
    bool flag = 10;
  }
  int32 after = 20;
}

// Recursive structure (singular, repeated and map recursion).
message Tree {
  string label = 1;
  Tree left = 2;
  Tree right = 3;
  repeated Tree children = 4;
  map<string, Tree> named = 5;
}

// Field names that are Odin keywords or builtins.
message Keywords {
  int32 proc = 1;
  string map = 2;
  bool context = 3;
  repeated string string = 4;
  int32 len = 5;
}

message WithWellKnown {
  google.protobuf.Timestamp created = 1;
  google.protobuf.Struct attributes = 2;
  test.legacy.Legacy legacy = 3;
}

message Large {
  int32 f1 = 1;
  int32 f_max = 536870911;
  string f_big = 100000;
}

message Empty {}
